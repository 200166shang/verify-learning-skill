version: 2

topic:
  id: edge-model-deployment
  title: 端侧模型部署到底在做什么
  workspace: edge-model-deployment

goal:
  desired_outcome:
    - 能够解释清楚一个训练完成的深度学习模型，怎样从模型文件进入端侧程序，经过输入预处理、Runtime 推理、后处理，最终变成业务程序可以使用的结果。
    - 面对真实端侧部署代码时，能够判断主要代码分别处于部署链路的哪个环节。
  central_question: 一个训练完成的深度学习模型，如何在端侧程序中完成从模型文件到业务结果的完整推理链路？
  working_claim: 端侧模型部署的核心，是把离线训练得到的模型转化为端侧 Runtime 可执行的推理链路，并正确完成输入、推理、输出与业务结果之间的数据衔接。
  out_of_scope:
    - 深入推导训练阶段的数学公式
    - 从零训练神经网络
    - CUDA kernel 或 NPU 算子开发
    - 与当前部署理解无直接关系的完整深度学习课程

